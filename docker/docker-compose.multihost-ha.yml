        rest.address: ${NODE_C_HOST:-node-c}
        rest.bind-address: 0.0.0.0
        rest.port: ${JM_C_REST_PORT:-8081}
        blob.server.port: ${JM_C_BLOB_PORT:-6124}
        jobmanager.memory.process.size: 700m
