# Local single-node stack. Brought up with `make up` from the repo root.
#
# Invariant 4 — Kafka has TWO listeners:
#   containers  → kafka:9092        (INTERNAL)
#   host scripts → localhost:29092  (EXTERNAL)
# Host code pointed at kafka:9092 hangs on metadata fetch rather than erroring.

name: petafs

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: petafs-kafka
    restart: unless-stopped
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker — every replication factor must be 1 or topic creation hangs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 2
      # Without this the broker writes to /tmp/kafka-logs — container-local, so
      # every topic dies with the container while the image's own
      # /var/lib/kafka/data volume sits empty. Point it at the named volume.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${CLUSTER_ID:-petafs-local-cluster-01}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: petafs-redis
    restart: unless-stopped
    volumes:
      # Redis ships RDB snapshotting on by default (save 3600 1 300 100 60
      # 10000) but /data is container-local, so it was snapshotting into
      # nothing. Features are derived and TTL'd at 30 min, so losing them costs
      # a cold cache rather than data — but "configured yet not durable" is the
      # same lie the checkpoint gap was (ADR-011), so make it true.
      - redis-data:/data
    ports:
      # Host port is 6380, not 6379, to coexist with a system/Homebrew redis.
      # Only the HOST side moves: inside the compose network this is still
      # redis:6379, so the Flink sink is unaffected. Host-side Feast reads
      # (feature_store.yaml, serving scripts) must use localhost:6380.
      - "${REDIS_HOST_PORT:-6380}:6379"
    # Stack (not plain redis) for the optional RediSearch ANN index — Feast 0.65
    # has no vector search of its own on Redis (ADR-004).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  jobmanager:
    build:
      context: ..
      dockerfile: docker/flink/Dockerfile
    image: petafs/flink:2.2.1
    container_name: petafs-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      # PyFlink UDFs are cloudpickled and unpickled in a SEPARATE Python worker
      # process, which does not inherit the driver's sys.path. Without this the
      # job submits fine and then dies in a restart loop with
      # "ModuleNotFoundError: No module named 'src'".
      PYTHONPATH: /opt/project
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 2
        state.backend.type: rocksdb
        # Checkpoints must go somewhere BOTH the JobManager and TaskManager can
        # read, and that outlives a container. Without a checkpoint directory,
        # `execution.checkpointing.interval` alone buys nothing: in-flight
        # window state does not survive a restart. Locally that is a shared
        # named volume; in production it is object storage (s3://, gs://).
        execution.checkpointing.dir: file:///flink-state/checkpoints
        execution.checkpointing.savepoint-dir: file:///flink-state/savepoints
        execution.checkpointing.interval: 30s
        # Keep the last checkpoint when a job is cancelled, so a cancel/resubmit
        # cycle can resume instead of replaying from the Kafka offset.
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.num-retained: 3
        restart-strategy.type: exponential-delay
    volumes:
      - ../src:/opt/project/src:ro
      - ../contracts:/opt/project/contracts:ro
      - flink-state:/flink-state
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  taskmanager:
    image: petafs/flink:2.2.1
    container_name: petafs-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      # See the jobmanager note: the UDF worker process needs this to unpickle
      # functions whose classes live under /opt/project/src.
      PYTHONPATH: /opt/project
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 2
        state.backend.type: rocksdb
        # Must match the JobManager: the TaskManager writes the checkpoint data
        # and the JobManager writes the metadata, so both need this path.
        execution.checkpointing.dir: file:///flink-state/checkpoints
        execution.checkpointing.savepoint-dir: file:///flink-state/savepoints
    volumes:
      - ../src:/opt/project/src:ro
      - ../contracts:/opt/project/contracts:ro
      - flink-state:/flink-state
    depends_on:
      jobmanager:
        condition: service_healthy
    # No healthcheck: registration with the JobManager is the real signal,
    # and it is visible at http://localhost:8081.

  kafka-ui:
    # kafbat is the maintained fork; provectuslabs/kafka-ui was abandoned in
    # 2024 and predates Kafka 4.x entirely.
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: petafs-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: petafs-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["ui"]   # opt-in: `make up UI=1` — saves ~400 MB when not needed

volumes:
  # Checkpoint/savepoint storage shared by the JobManager and TaskManager.
  # Survives `make down`; removed by `make clean` (down -v).
  flink-state:
  kafka-data:
  redis-data:
