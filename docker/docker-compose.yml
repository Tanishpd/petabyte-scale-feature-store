# Local single-node stack. Brought up with `make up` from the repo root.
#
# Invariant 4 — Kafka has TWO listeners:
#   containers  → kafka:9092        (INTERNAL)
#   host scripts → localhost:29092  (EXTERNAL)
# Host code pointed at kafka:9092 hangs on metadata fetch rather than erroring.

name: petafs

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: petafs-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker — every replication factor must be 1 or topic creation hangs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 2
      CLUSTER_ID: ${CLUSTER_ID:-petafs-local-cluster-01}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: petafs-redis
    ports:
      - "6379:6379"
    # Stack (not plain redis) for the optional RediSearch ANN index — Feast 0.65
    # has no vector search of its own on Redis (ADR-004).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  jobmanager:
    build:
      context: ..
      dockerfile: docker/flink/Dockerfile
    image: petafs/flink:2.2.1
    container_name: petafs-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 2
        state.backend.type: rocksdb
        execution.checkpointing.interval: 30s
    volumes:
      - ../src:/opt/project/src:ro
      - ../contracts:/opt/project/contracts:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  taskmanager:
    image: petafs/flink:2.2.1
    container_name: petafs-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 2
        state.backend.type: rocksdb
    volumes:
      - ../src:/opt/project/src:ro
      - ../contracts:/opt/project/contracts:ro
    depends_on:
      jobmanager:
        condition: service_healthy
    # No healthcheck: registration with the JobManager is the real signal,
    # and it is visible at http://localhost:8081.

  kafka-ui:
    # kafbat is the maintained fork; provectuslabs/kafka-ui was abandoned in
    # 2024 and predates Kafka 4.x entirely.
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: petafs-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: petafs-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["ui"]   # opt-in: `make up UI=1` — saves ~400 MB when not needed
