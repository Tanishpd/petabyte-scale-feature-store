global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flink
    # Flink's Prometheus reporter exposes one port per process. The JobManager
    # carries the job-level metrics (checkpoints, restarts); the TaskManagers
    # carry throughput and backpressure.
    static_configs:
      - targets: ["jobmanager:9250"]
        labels: {role: jobmanager}
    dns_sd_configs:
      - names: ["tasks.taskmanager"]
        type: A
        port: 9250

  - job_name: flink-taskmanagers
    static_configs:
      - targets: ["taskmanager:9250"]
        labels: {role: taskmanager}
