# Production topology. NOT the laptop stack — use docker-compose.yml for that.
#
#   make prod-up      bring this up
#   make prod-verify   run the failure drills (kill a broker, kill the Redis primary, ...)
#
# Differences from the dev stack, each closing a gap named in the README's
# production-readiness section:
#
#   3 Kafka brokers, RF=3, min.insync.replicas=2   single broker at RF=1 lost everything
#   MinIO + s3:// checkpoints                       file:// is meaningless off one node
#   Redis primary + replica + Sentinel              single Redis was a hard dependency
#   requirepass on Redis and Sentinel               everything was unauthenticated
#   SASL/PLAIN on Kafka                             everything was unauthenticated
#   Prometheus + Grafana + alert rules              nothing watched lag or staleness
#
# ⚠️ Sizing: this topology wants ~10 GiB of RAM. It does NOT fit alongside the
# pipeline on an 8 GiB Docker VM — heaps here are deliberately small so the
# failure drills can run locally, and are NOT production sizing. See
# docs/RUNBOOK.md for real numbers.

name: petafs-prod

secrets:
  redis_password:
    file: ./secrets/redis_password
  kafka_password:
    file: ./secrets/kafka_password
  tls_storepass:
    file: ./secrets/tls_storepass
  minio_root_password:
    file: ./secrets/minio_root_password
  grafana_password:
    file: ./secrets/grafana_password

x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  restart: unless-stopped
  secrets: [kafka_password, tls_storepass]
  # The image's runner reads its configuration from the environment, so the
  # credentials have to arrive there — but they arrive from a mounted file at
  # container start rather than from `environment:`, which is what keeps them
  # out of `docker inspect` and `docker compose config`. Same mechanism as the
  # HA topology (ADR-015); `exec` at the end so PID 1 is still Kafka's runner
  # and signals reach it.
  command:
    - sh
    - -c
    - |
      PW=$$(cat /run/secrets/kafka_password)
      SP=$$(cat /run/secrets/tls_storepass)
      export KAFKA_SSL_KEYSTORE_PASSWORD="$$SP"
      export KAFKA_SSL_KEY_PASSWORD="$$SP"
      export KAFKA_SSL_TRUSTSTORE_PASSWORD="$$SP"
      JAAS="org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$${KAFKA_USER:-petafs}\" password=\"$$PW\" user_$${KAFKA_USER:-petafs}=\"$$PW\";"
      export KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG="$$JAAS"
      export KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG="$$JAAS"
      exec /etc/kafka/docker/run
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
    # SASL_SSL: authenticated AND encrypted. SASL_PLAINTEXT proves who a client
    # is but leaves every event, and the credentials themselves, readable on the
    # wire. CONTROLLER stays PLAINTEXT — internal-only, and securing the KRaft
    # quorum has a bootstrap-ordering problem.
    # KEYSTORE/KEY/TRUSTSTORE passwords are exported by the `command:` above
    # from /run/secrets/tls_storepass — deliberately absent here.
    KAFKA_SSL_TRUSTSTORE_LOCATION: /tls/kafka.truststore.jks
    # Verify the broker hostname against the cert SANs. Empty (the Kafka
    # default) encrypts the transport while accepting any certificate.
    KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
    # SASL/PLAIN on both client-facing listeners. CONTROLLER stays PLAINTEXT: it
    # is never exposed outside the compose network, and securing the KRaft
    # quorum has a bootstrap-ordering problem (SCRAM credentials live in the
    # metadata log the quorum is forming). Production uses mTLS between brokers.
    KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
    KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
    # Both JAAS strings are built in the `command:` above from the mounted
    # file. Declaring them here would put the password back into
    # `docker compose config`, which is the thing people paste into issues.
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    # The whole point of three brokers: survive losing one.
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_NUM_PARTITIONS: 6
    # Small heaps so three brokers fit on a laptop for the drills. Production
    # wants 6+ GiB per broker; see docs/RUNBOOK.md.
    KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    CLUSTER_ID: ${CLUSTER_ID:-petafs-prod-cluster-1}

services:
  kafka1:
    <<: *kafka-common
    container_name: petafs-prod-kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_SSL_KEYSTORE_LOCATION: /tls/kafka1.keystore.jks
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
    ports: ["29092:29092"]
    volumes:
      - kafka1-data:/var/lib/kafka/data
      - ./tls/out:/tls:ro
    healthcheck:
      # Must authenticate. An unauthenticated healthcheck against a SASL broker
      # fails forever: every broker reports unhealthy and anything gated on
      # `depends_on: service_healthy` silently never starts. The symptom reads
      # as "Flink won't come up", not "auth is misconfigured".
      test:
        - CMD-SHELL
        - |
          printf 'security.protocol=SASL_SSL\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\nssl.truststore.location=/tls/kafka.truststore.jks\nssl.truststore.password=%s\n' "$${KAFKA_USER:-petafs}" "$$(cat /run/secrets/kafka_password)" "$$(cat /run/secrets/tls_storepass)" > /tmp/hc.properties
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/hc.properties >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  kafka2:
    <<: *kafka-common
    container_name: petafs-prod-kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_SSL_KEYSTORE_LOCATION: /tls/kafka2.keystore.jks
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29093,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:29093
    ports: ["29093:29093"]
    volumes:
      - kafka2-data:/var/lib/kafka/data
      - ./tls/out:/tls:ro
    healthcheck:
      # Must authenticate. An unauthenticated healthcheck against a SASL broker
      # fails forever: every broker reports unhealthy and anything gated on
      # `depends_on: service_healthy` silently never starts. The symptom reads
      # as "Flink won't come up", not "auth is misconfigured".
      test:
        - CMD-SHELL
        - |
          printf 'security.protocol=SASL_SSL\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\nssl.truststore.location=/tls/kafka.truststore.jks\nssl.truststore.password=%s\n' "$${KAFKA_USER:-petafs}" "$$(cat /run/secrets/kafka_password)" "$$(cat /run/secrets/tls_storepass)" > /tmp/hc.properties
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/hc.properties >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  kafka3:
    <<: *kafka-common
    container_name: petafs-prod-kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_SSL_KEYSTORE_LOCATION: /tls/kafka3.keystore.jks
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:29094
    ports: ["29094:29094"]
    volumes:
      - kafka3-data:/var/lib/kafka/data
      - ./tls/out:/tls:ro
    healthcheck:
      # Must authenticate. An unauthenticated healthcheck against a SASL broker
      # fails forever: every broker reports unhealthy and anything gated on
      # `depends_on: service_healthy` silently never starts. The symptom reads
      # as "Flink won't come up", not "auth is misconfigured".
      test:
        - CMD-SHELL
        - |
          printf 'security.protocol=SASL_SSL\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\nssl.truststore.location=/tls/kafka.truststore.jks\nssl.truststore.password=%s\n' "$${KAFKA_USER:-petafs}" "$$(cat /run/secrets/kafka_password)" "$$(cat /run/secrets/tls_storepass)" > /tmp/hc.properties
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/hc.properties >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  minio:
    secrets: [minio_root_password]
    # Stands in for S3/GCS. Checkpoints must live on storage that is not tied to
    # any one node: `file://` on a shared volume works for a single-host demo and
    # is meaningless once the JobManager and TaskManagers are on different
    # machines. Swapping this for real S3 is a credentials change, not a code one.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: petafs-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-petafs}
      # MinIO reads this natively; no wrapper needed.
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    secrets: [minio_root_password]
    # Creates the checkpoint bucket once, then exits.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: petafs-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set petafs http://minio:9000 ${MINIO_USER:-petafs} $$(cat /run/secrets/minio_root_password)
      && mc mb --ignore-existing petafs/flink-checkpoints
      && mc mb --ignore-existing petafs/flink-savepoints
      && echo 'buckets ready'"

  redis-primary:
    secrets: [redis_password]
    image: redis/redis-stack-server:7.4.0-v8
    container_name: petafs-prod-redis-primary
    restart: unless-stopped
    # A config FILE, not command-line args. Redis persists a Sentinel-driven
    # promotion with CONFIG REWRITE, which only works against a file — with
    # `--replicaof` as an argument the old role reasserts on every restart and
    # fights Sentinel. That is what deadlocked both nodes into replicas.
    # The file is seeded once and thereafter owned by Redis and Sentinel.
    entrypoint:
      - sh
      - -c
      - |
        PEER=redis-replica
        PW=$$(cat /run/secrets/redis_password)
        CONF=/data/redis.conf
        if [ ! -f "$$CONF" ]; then
          cat > "$$CONF" <<EOF
        requirepass $$PW
        masterauth $$PW
        appendonly yes
        dir /data
        # TLS-only: `port 0` disables the plaintext listener entirely, so an
        # unencrypted client cannot connect even with the right password.
        port 0
        tls-port 6379
        tls-cert-file /tls/redis-primary.crt
        tls-key-file /tls/redis-primary.key
        tls-ca-cert-file /tls/ca.crt
        # Replication traffic is encrypted too — otherwise the data is in the
        # clear on the wire between primary and replica.
        tls-replication yes
        # Server-authenticated TLS; identity is the password. mTLS
        # (tls-auth-clients yes + a client cert) is the stronger posture.
        tls-auth-clients no
        EOF
        fi
        # Refresh a STALE replicaof ADDRESS while preserving the ROLE.
        #
        # Redis rewrites `replicaof redis-primary 6379` into the resolved
        # `replicaof <ip> 6379` (CONFIG REWRITE, which Sentinel triggers on
        # promotion). `docker compose down` then destroys the network and `up`
        # recreates it on a new subnet, so that IP is gone forever: the node can
        # never reconnect, and Sentinel cannot discover it either because the
        # master never learns it exists. Measured — the replica sat at
        # `master_link_status:down` against 172.21.0.2 while everything ran on
        # 172.19.0.x, and all three sentinels reported `num-slaves 0`. The stack
        # came back permanently one-legged with every healthcheck green.
        #
        # The role must survive (that is why redis.conf is a file at all — see
        # above), so only the address is rewritten. With exactly two data nodes,
        # "my master is the other one" is always correct, including after a
        # failover has swapped which is which.
        if grep -qi '^replicaof ' "$$CONF"; then
          grep -vi '^replicaof ' "$$CONF" > "$$CONF.tmp"
          echo "replicaof $$PEER 6379" >> "$$CONF.tmp"
          mv "$$CONF.tmp" "$$CONF"
        fi
        exec redis-server "$$CONF"
    volumes:
      - redis-primary-data:/data
      - ./tls/out:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis-replica:
    secrets: [redis_password]
    image: redis/redis-stack-server:7.4.0-v8
    container_name: petafs-prod-redis-replica
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        PEER=redis-primary
        PW=$$(cat /run/secrets/redis_password)
        CONF=/data/redis.conf
        if [ ! -f "$$CONF" ]; then
          cat > "$$CONF" <<EOF
        requirepass $$PW
        masterauth $$PW
        appendonly yes
        dir /data
        # TLS-only: `port 0` disables the plaintext listener entirely, so an
        # unencrypted client cannot connect even with the right password.
        port 0
        tls-port 6379
        tls-cert-file /tls/redis-primary.crt
        tls-key-file /tls/redis-primary.key
        tls-ca-cert-file /tls/ca.crt
        # Replication traffic is encrypted too — otherwise the data is in the
        # clear on the wire between primary and replica.
        tls-replication yes
        # Server-authenticated TLS; identity is the password. mTLS
        # (tls-auth-clients yes + a client cert) is the stronger posture.
        tls-auth-clients no
        replicaof redis-primary 6379
        EOF
        fi
        # Refresh a STALE replicaof ADDRESS while preserving the ROLE.
        #
        # Redis rewrites `replicaof redis-primary 6379` into the resolved
        # `replicaof <ip> 6379` (CONFIG REWRITE, which Sentinel triggers on
        # promotion). `docker compose down` then destroys the network and `up`
        # recreates it on a new subnet, so that IP is gone forever: the node can
        # never reconnect, and Sentinel cannot discover it either because the
        # master never learns it exists. Measured — the replica sat at
        # `master_link_status:down` against 172.21.0.2 while everything ran on
        # 172.19.0.x, and all three sentinels reported `num-slaves 0`. The stack
        # came back permanently one-legged with every healthcheck green.
        #
        # The role must survive (that is why redis.conf is a file at all — see
        # above), so only the address is rewritten. With exactly two data nodes,
        # "my master is the other one" is always correct, including after a
        # failover has swapped which is which.
        if grep -qi '^replicaof ' "$$CONF"; then
          grep -vi '^replicaof ' "$$CONF" > "$$CONF.tmp"
          echo "replicaof $$PEER 6379" >> "$$CONF.tmp"
          mv "$$CONF.tmp" "$$CONF"
        fi
        exec redis-server "$$CONF"
    volumes:
      - redis-replica-data:/data
      - ./tls/out:/tls:ro
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis-sentinel-1:
    secrets: [redis_password]
    image: redis/redis-stack-server:7.4.0-v8
    container_name: petafs-prod-redis-sentinel-1
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        PW=$$(cat /run/secrets/redis_password)
        CONF=/data/sentinel.conf
        # REGENERATED ON EVERY BOOT, unlike redis.conf next door — and the
        # asymmetry is deliberate.
        #
        # Sentinel REWRITES this file, replacing the hostname we give it with
        # the address it resolved: `monitor mymaster redis-primary 6379`
        # becomes `monitor mymaster 172.21.0.2 6379`. `resolve-hostnames yes`
        # does not prevent that — it only permits a hostname as INPUT.
        # `docker compose down` removes the network, `up` recreates it on a new
        # subnet, and the persisted file then points every sentinel at an
        # address that no longer exists. Measured: all three reported
        # `flags s_down,master` against 172.21.0.2 while the containers were on
        # 172.19.0.x, and a kill produced no promotion at all. Nothing looked
        # wrong — containers up, healthchecks green, failover simply dead.
        #
        # Rewriting is safe in a way that rewriting redis.conf is NOT: redis.conf
        # carries the node's ROLE, which Sentinel owns after a promotion and
        # which must survive a restart. sentinel.conf carries only addresses and
        # peers, all of which Sentinel re-derives — it follows `master_host`
        # from INFO if pointed at a replica, and rediscovers its peers over the
        # __sentinel__:hello channel within seconds.
        if true; then
          cat > "$$CONF" <<EOF
        port 0
        tls-port 26379
        tls-cert-file /tls/sentinel.crt
        tls-key-file /tls/sentinel.key
        tls-ca-cert-file /tls/ca.crt
        tls-replication yes
        tls-auth-clients no
        requirepass $$PW
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-primary 6379 2
        sentinel auth-pass mymaster $$PW
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        dir /data
        EOF
        fi
        exec redis-sentinel "$$CONF"
    volumes:
      - redis-sentinel-1-data:/data
      - ./tls/out:/tls:ro
    ports: ["26379:26379"]
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  redis-sentinel-2:
    secrets: [redis_password]
    image: redis/redis-stack-server:7.4.0-v8
    container_name: petafs-prod-redis-sentinel-2
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        PW=$$(cat /run/secrets/redis_password)
        CONF=/data/sentinel.conf
        # REGENERATED ON EVERY BOOT, unlike redis.conf next door — and the
        # asymmetry is deliberate.
        #
        # Sentinel REWRITES this file, replacing the hostname we give it with
        # the address it resolved: `monitor mymaster redis-primary 6379`
        # becomes `monitor mymaster 172.21.0.2 6379`. `resolve-hostnames yes`
        # does not prevent that — it only permits a hostname as INPUT.
        # `docker compose down` removes the network, `up` recreates it on a new
        # subnet, and the persisted file then points every sentinel at an
        # address that no longer exists. Measured: all three reported
        # `flags s_down,master` against 172.21.0.2 while the containers were on
        # 172.19.0.x, and a kill produced no promotion at all. Nothing looked
        # wrong — containers up, healthchecks green, failover simply dead.
        #
        # Rewriting is safe in a way that rewriting redis.conf is NOT: redis.conf
        # carries the node's ROLE, which Sentinel owns after a promotion and
        # which must survive a restart. sentinel.conf carries only addresses and
        # peers, all of which Sentinel re-derives — it follows `master_host`
        # from INFO if pointed at a replica, and rediscovers its peers over the
        # __sentinel__:hello channel within seconds.
        if true; then
          cat > "$$CONF" <<EOF
        port 0
        tls-port 26379
        tls-cert-file /tls/sentinel.crt
        tls-key-file /tls/sentinel.key
        tls-ca-cert-file /tls/ca.crt
        tls-replication yes
        tls-auth-clients no
        requirepass $$PW
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-primary 6379 2
        sentinel auth-pass mymaster $$PW
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        dir /data
        EOF
        fi
        exec redis-sentinel "$$CONF"
    volumes:
      - redis-sentinel-2-data:/data
      - ./tls/out:/tls:ro
    ports: ["26380:26379"]
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  redis-sentinel-3:
    secrets: [redis_password]
    image: redis/redis-stack-server:7.4.0-v8
    container_name: petafs-prod-redis-sentinel-3
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        PW=$$(cat /run/secrets/redis_password)
        CONF=/data/sentinel.conf
        # REGENERATED ON EVERY BOOT, unlike redis.conf next door — and the
        # asymmetry is deliberate.
        #
        # Sentinel REWRITES this file, replacing the hostname we give it with
        # the address it resolved: `monitor mymaster redis-primary 6379`
        # becomes `monitor mymaster 172.21.0.2 6379`. `resolve-hostnames yes`
        # does not prevent that — it only permits a hostname as INPUT.
        # `docker compose down` removes the network, `up` recreates it on a new
        # subnet, and the persisted file then points every sentinel at an
        # address that no longer exists. Measured: all three reported
        # `flags s_down,master` against 172.21.0.2 while the containers were on
        # 172.19.0.x, and a kill produced no promotion at all. Nothing looked
        # wrong — containers up, healthchecks green, failover simply dead.
        #
        # Rewriting is safe in a way that rewriting redis.conf is NOT: redis.conf
        # carries the node's ROLE, which Sentinel owns after a promotion and
        # which must survive a restart. sentinel.conf carries only addresses and
        # peers, all of which Sentinel re-derives — it follows `master_host`
        # from INFO if pointed at a replica, and rediscovers its peers over the
        # __sentinel__:hello channel within seconds.
        if true; then
          cat > "$$CONF" <<EOF
        port 0
        tls-port 26379
        tls-cert-file /tls/sentinel.crt
        tls-key-file /tls/sentinel.key
        tls-ca-cert-file /tls/ca.crt
        tls-replication yes
        tls-auth-clients no
        requirepass $$PW
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-primary 6379 2
        sentinel auth-pass mymaster $$PW
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        dir /data
        EOF
        fi
        exec redis-sentinel "$$CONF"
    volumes:
      - redis-sentinel-3-data:/data
      - ./tls/out:/tls:ro
    ports: ["26381:26379"]
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  jobmanager:
    secrets: [redis_password, kafka_password, tls_storepass, minio_root_password]
    image: petafs/flink:2.2.1
    container_name: petafs-prod-jobmanager
    restart: unless-stopped
    # Flink's S3 filesystem reads AWS_SECRET_ACCESS_KEY from the process
    # environment only — it has no _FILE form — so it is exported here at
    # start rather than declared in `environment:`, where it would land in
    # `docker inspect`. Same wrapper as the HA topology.
    entrypoint:
      - sh
      - -c
      - export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_root_password)"; exec /docker-entrypoint.sh "$$@"
      - --
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      PYTHONPATH: /opt/project
      # Credentials come from the environment, never the image or the repo.
      # In a real deployment these are injected by the orchestrator's secret
      # store; MINIO_* are the local stand-ins.
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-petafs}
      # Sentinel discovery, not a fixed host: after a promotion a fixed host is
      # either gone or a read-only replica, and every write fails with READONLY.
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_TLS_CA: /tls/ca.crt
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SSL_TRUSTSTORE: /tls/kafka.truststore.jks
      TLS_STOREPASS_FILE: /run/secrets/tls_storepass
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_USER: ${KAFKA_USER:-petafs}
      KAFKA_PASSWORD_FILE: /run/secrets/kafka_password
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 2
        state.backend.type: rocksdb
        state.backend.incremental: true
        # Object storage, not a shared volume. This is the line that makes the
        # topology survive losing the host a TaskManager ran on. The /petafs prefix
        # matters: Flink rejects a bucket root with "Cannot use the root directory
        # for checkpoints."
        execution.checkpointing.dir: s3://flink-checkpoints/petafs
        execution.checkpointing.savepoint-dir: s3://flink-savepoints/petafs
        execution.checkpointing.interval: 30s
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.num-retained: 5
        # Unaligned checkpoints keep barriers moving under backpressure, which
        # is exactly when checkpoints would otherwise time out.
        execution.checkpointing.unaligned.enabled: true
        restart-strategy.type: exponential-delay
        # Prometheus reporter — the plugin ships in the image, this activates it.
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
    volumes:
      - ../src:/opt/project/src:ro
      - ../contracts:/opt/project/contracts:ro
      - ./tls/out:/tls:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka1:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  taskmanager:
    secrets: [redis_password, kafka_password, tls_storepass, minio_root_password]
    image: petafs/flink:2.2.1
    restart: unless-stopped
    # Flink's S3 filesystem reads AWS_SECRET_ACCESS_KEY from the process
    # environment only — it has no _FILE form — so it is exported here at
    # start rather than declared in `environment:`, where it would land in
    # `docker inspect`. Same wrapper as the HA topology.
    entrypoint:
      - sh
      - -c
      - export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_root_password)"; exec /docker-entrypoint.sh "$$@"
      - --
    command: taskmanager
    # No container_name: this is the one service meant to scale.
    #   docker compose -f docker/docker-compose.prod.yml up -d --scale taskmanager=3
    environment:
      PYTHONPATH: /opt/project
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-petafs}
      # Sentinel discovery, not a fixed host: after a promotion a fixed host is
      # either gone or a read-only replica, and every write fails with READONLY.
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_TLS_CA: /tls/ca.crt
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SSL_TRUSTSTORE: /tls/kafka.truststore.jks
      TLS_STOREPASS_FILE: /run/secrets/tls_storepass
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_USER: ${KAFKA_USER:-petafs}
      KAFKA_PASSWORD_FILE: /run/secrets/kafka_password
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 2
        state.backend.type: rocksdb
        state.backend.incremental: true
        execution.checkpointing.dir: s3://flink-checkpoints/petafs
        execution.checkpointing.savepoint-dir: s3://flink-savepoints/petafs
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
    volumes:
      - ../src:/opt/project/src:ro
      - ../contracts:/opt/project/contracts:ro
      - ./tls/out:/tls:ro
    depends_on:
      jobmanager:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: petafs-prod-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on:
      jobmanager:
        condition: service_healthy

  # Alerting DELIVERY. Prometheus decides an alert is firing; Alertmanager is
  # what turns that into a notification someone receives. Without it the rules
  # were evaluated and dropped — see ADR-018.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: petafs-prod-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The receiver, so delivery can be ASSERTED rather than assumed. Stands in for
  # Slack/PagerDuty, which this repo has no account for — but the path it proves
  # (rule -> Prometheus -> Alertmanager -> receiver) is the whole path, and
  # swapping the receiver changes nothing else.
  alert-sink:
    image: python:3.12-slim
    container_name: petafs-prod-alert-sink
    restart: unless-stopped
    command: ["python", "/app/webhook_sink.py"]
    volumes:
      - ./observability/webhook_sink.py:/app/webhook_sink.py:ro
    ports: ["9099:9099"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9099/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  grafana:
    secrets: [grafana_password]
    image: grafana/grafana:11.6.0
    container_name: petafs-prod-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3000:3000"]
    depends_on: [prometheus]
    profiles: ["ui"]

volumes:
  redis-primary-data:
  redis-replica-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  minio-data:
